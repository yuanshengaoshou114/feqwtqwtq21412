name: Auto Update Processed Azur Lane Data (CN)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 你的仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest CN Lua scripts
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          path: lua-scripts
          fetch-depth: 1

      - name: Pull latest CN raw data from upstream
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneData
          path: raw-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 复制 Lua 文件
        run: |
          cp lua-scripts/CN/sharecfgdata/ship_skin_template.lua ./
          cp lua-scripts/CN/sharecfgdata/ship_skin_words.lua ./
          cp lua-scripts/CN/sharecfg/name_code.lua ./
          cp lua-scripts/CN/sharecfg/painting_filte_map.lua ./
          cp lua-scripts/CN/sharecfg/ship_skin_expression.lua ./
          cp lua-scripts/CN/sharecfgdata/ship_data_statistics.lua ./
          cp lua-scripts/CN/sharecfgdata/item_data_statistics.lua ./ 
          cp lua-scripts/CN/sharecfgdata/skill_data_template.lua ./ 
          cp lua-scripts/CN/sharecfgdata/skill_data_display.lua ./ 

      - name: 复制原始 JSON 文件
        run: |
          cp raw-data/CN/GameCfg/story.json ./story.json 2>/dev/null || echo "story.json 未找到"
          cp raw-data/CN/ShareCfg/activity_sp_story.json ./activity_sp_story.json 2>/dev/null || echo "activity_sp_story.json 未找到"
          cp raw-data/CN/ShareCfg/memory_template.json ./memory_template.json 2>/dev/null || echo "memory_template.json 未找到"
          cp raw-data/CN/ShareCfg/memory_group.json ./memory_group.json 2>/dev/null || echo "memory_group.json 未找到"

      - name: 执行处理脚本
        run: |
          python 1.py

      - name: 提交所有生成的文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: auto update processed Azur Lane CN data
            Run #${{ github.run_number }}
          file_pattern: |
            *.json
          add_options: '--all'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
