name: Auto Update Processed Azur Lane Data (CN)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 你的仓库（带完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest CN Lua scripts (Lua source files)
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          path: lua-scripts
          fetch-depth: 1

      - name: Pull latest CN raw data from upstream (JSON files)
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneData
          path: raw-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 复制 Lua 文件到工作目录
        run: |
          # 复制 Lua 文件
          cp lua-scripts/CN/sharecfgdata/ship_skin_template.lua ./
          cp lua-scripts/CN/sharecfgdata/ship_skin_words.lua ./
          cp lua-scripts/CN/sharecfg/name_code.lua ./
          cp lua-scripts/CN/sharecfg/painting_filte_map.lua ./
          cp lua-scripts/CN/sharecfg/ship_skin_expression.lua ./
          
          echo "Lua 文件列表："
          ls -la *.lua

      - name: 复制上游原始 JSON 文件
        run: |
          cp raw-data/CN/GameCfg/story.json ./story.json 2>/dev/null || echo "story.json 未找到"
          cp raw-data/CN/ShareCfg/activity_sp_story.json ./activity_sp_story.json 2>/dev/null || echo "activity_sp_story.json 未找到"
          
          # 注意：ship_skin_expression.json 会由 Lua 转换生成，不需要从 raw-data 复制
          # 但如果有其他需要的 JSON 文件可以继续复制
          
          ls -la *.json 2>/dev/null || true

      - name: 强制删除仓库根目录下所有旧的生成文件
        run: |
          set -e
          
          FILES_TO_DELETE=(
            "al_combined_final.json"
            "zuming.json"
            "name.json"
            "文本配置.json"
            "skin_voice_mapping_optimized.json"
            "story.json"
            "activity_sp_story.json"
            "ship_skin_expression.json"
            "ship_skin_template.json"
            "ship_skin_words.json"
            "name_code.json"
            "painting_filte_map.json"
          )
          
          echo "开始强制删除旧文件..."
          
          for file in "${FILES_TO_DELETE[@]}"; do
            if [ -f "$file" ]; then
              echo "删除: $file"
              rm -f "$file"
              git rm --quiet "$file" 2>/dev/null || true
            fi
          done
          
          git status --short
          git commit -m "chore: remove old generated files before update" || echo "没有文件被删除，无需 commit 删除"

      - name: 执行处理脚本生成新文件
        run: |
          echo "运行前文件列表："
          ls -la *.lua *.json 2>/dev/null || echo "无文件"
          
          python 1.py || { echo "1.py 执行失败！"; exit 1; }
          
          echo "运行后文件列表："
          ls -la *.json
          
          echo "关键文件检查："
          for f in al_combined_final.json name.json story.json; do
            [ -f "$f" ] && echo "$f 存在，大小 $(du -h "$f" | cut -f1)" || echo "!!! $f 缺失 !!!"
          done

      - name: 提交所有生成的文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: auto update processed Azur Lane CN data
            Run #${{ github.run_number }}
          file_pattern: |
            *.json
          add_options: '--all'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
