name: Auto Update Processed Azur Lane Data (CN)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 你的仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull JSON data from AzurLaneData
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneData
          path: raw-data
          fetch-depth: 1

      - name: Pull Lua data from AzurLaneLuaScripts
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          path: lua-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 删除旧的生成文件
        run: |
          FILES_TO_DELETE=(
            "al_combined_final.json"
            "zuming.json"
            "name.json"
            "文本配置.json"
            "skin_voice_mapping_optimized.json"
            "story.json"
            "activity_sp_story.json"
            "ship_skin_expression.json"
          )
          for file in "${FILES_TO_DELETE[@]}"; do
            rm -f "$file"
            git rm --quiet "$file" 2>/dev/null || true
          done
          git commit -m "chore: remove old files" || true

      - name: 转换 Lua 文件为 JSON
        run: |
          python lua_to_json_converter.py

      - name: 复制 JSON 文件
        run: |
          cp raw-data/CN/GameCfg/story.json ./story.json 2>/dev/null || echo "story.json 未找到"
          cp raw-data/CN/ShareCfg/activity_sp_story.json ./activity_sp_story.json 2>/dev/null || echo "activity_sp_story.json 未找到"

      - name: 执行处理脚本
        run: |
          python 1.py

      - name: 提交生成的文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto update CN data"
          file_pattern: "*.json"
          add_options: "--all"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
