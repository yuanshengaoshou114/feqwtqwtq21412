name: Generate Fake Ship Config

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 你的仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 读取 ship_data_statistics.json 并生成 fake_ship_config.txt
        run: |
          python generate_fake_config.py

      - name: 提交生成的文件到 GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: auto update fake_ship_config.txt
            Run #${{ github.run_number }}
          file_pattern: |
            fake_ship_config.txt
          add_options: '--all'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: 安装 rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: 配置 R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = public-read
          EOF

      - name: 同步文件到 R2
        run: |
          rclone copy fake_ship_config.txt r2:zaizai2/fake_ship_config.txt --progress

      - name: 验证上传成功
        run: |
          echo "文件已上传到: https://modxiazai.genshinnb.shop/fake_ship_config.txt"
